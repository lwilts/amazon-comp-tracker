name: CI / CD

on:
  push:
  pull_request:

jobs:
  build-test-publish:
    name: Build, smoke-test${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && ', publish' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: amazon-comp-tracker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name ct-test -p 8000:8000 \
            -e SECRET_KEY=ci-test-secret \
            -e DATA_DIR=/tmp \
            amazon-comp-tracker:ci

          # Wait up to 30s for the backend to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/auth/status > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              break
            fi
            sleep 1
          done

          # Assert auth status returns expected shape
          curl -sf http://localhost:8000/api/auth/status | grep '"authenticated":false'

          # Assert SPA shell is served
          curl -sf http://localhost:8000/ | grep -qi 'html'

          docker stop ct-test

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/amazon-comp-tracker:latest
            ghcr.io/${{ github.repository_owner }}/amazon-comp-tracker:${{ github.sha }}
          cache-from: type=gha
