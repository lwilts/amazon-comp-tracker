services:
  app:
    image: ghcr.io/lwilts/amazon-comp-tracker:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DATA_DIR=/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/auth/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
